<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Meteoropolis</title>
  <link rel="stylesheet" href="assets/globals.css">
  <link rel="stylesheet" href="assets/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <h1>Weather & Photography</h1>
      <p>Discover the weather and its beauty, powered by OpenWeatherMap and Unsplash</p>
    </header>

    <main>
      <form id="search" class="search-form">
        <input type="text" id="search-tf" placeholder="Enter a city (e.g., Madrid, Tokyo)" autocomplete="off"
          required />
        <button type="submit">Search</button>
      </form>
      <section class="info">
        <div id="conditions" class="weather-info">Loading weather...</div>
        <div id="photo" class="photo-container">Loading...</div>
      </section>
      
      <section id="thumbs" class="thumbnails"></section>
    </main>

    <footer>
      <p>
        Photo by <a id="credit-user" href="#" target="_blank">Photographer</a> on
        <a id="credit-platform" href="#" target="_blank">Unsplash</a>
      </p>
      <p>Made by @Syed</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>

</html>
